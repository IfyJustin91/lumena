services:
  lumen-server:
    build:
      context: ..
      dockerfile: packages/server/Dockerfile
    environment:
      STELLAR_NETWORK: local
      HORIZON_URL: http://stellar:8000
      SOROBAN_RPC_URL: http://stellar:8000/rpc
      REDIS_SENTINEL_HOSTS: sentinel-1:26379,sentinel-2:26379,sentinel-3:26379
      REDIS_MASTER_NAME: mymaster
      DATABASE_URL: postgres://lumen:lumen@postgres:5432/lumen
      OTEL_SERVICE_NAME: lumen-server
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_TRACES_EXPORTER: otlp
      OTEL_TRACES_SAMPLER: parentbased_always_on
      PKCS11_LIBRARY_PATH: /usr/lib/softhsm/libsofthsm2.so
      PKCS11_SLOT_ID: "0"
      PKCS11_PIN: "1234"
      PKCS11_KEY_LABEL: lumen-cosigner
    ports:
      - "3000:3000"
    depends_on:
      stellar:
        condition: service_healthy
      jaeger:
        condition: service_started
      softhsm:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.53.0
    profiles: ["monitoring"]
    volumes:
      - ./prometheus:/etc/prometheus:ro
    ports:
      - "9090:9090"
    depends_on:
      - lumen-server
      - alertmanager

  alertmanager:
    image: prom/alertmanager:v0.27.0
    profiles: ["monitoring"]
    volumes:
      - ./prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - "${PAGERDUTY_ROUTING_KEY_FILE:-./prometheus/pagerduty-routing-key}:/etc/alertmanager/pagerduty-routing-key:ro"
    ports:
      - "9093:9093"

  stellar:
    image: stellar/quickstart:testing
    command: ["--local"]
    ports:
      - "8000:8000"
      - "8080:8080"
      - "6000:6000"
    volumes:
      - stellar-data:/data
    platform: linux/amd64
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  jaeger:
    image: jaegertracing/all-in-one:1.57
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

  softhsm:
    image: softhsm/softhsm2:latest
    command:
      - /bin/sh
      - -c
      - |
        set -e
        mkdir -p /var/lib/softhsm/tokens
        softhsm2-util --init-token --free --label lumen --so-pin 0000 --pin 1234
        softhsm2-util --import /keys/cosigner.pem --token lumen --label lumen-cosigner --id 01 --pin 1234 || true
        echo "SoftHSM2 token initialized"
        exec tail -f /dev/null
    volumes:
      - softhsm-tokens:/var/lib/softhsm/tokens
      - softhsm-keys:/keys
    healthcheck:
      test: ["CMD-SHELL", "softhsm2-util --show-slots | grep -q lumen || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  stellar-data:
  softhsm-tokens:
  softhsm-keys: